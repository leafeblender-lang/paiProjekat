<div class="app-shell">
    <header class="app-header">
        <a
            class="app-title"
            [routerLink]="ulogovan() ? korisnickaPocetna() : '/'">
            {{ title }}
        </a>

        <nav class="app-menu" aria-label="Glavni meni">
            @if (ulogovan()) {
                <a [routerLink]="korisnickaPocetna()">Moj nalog</a>
                <button type="button" (click)="logout()">Izloguj se</button>
            }
            @else {
                <a routerLink="/">Pocetna</a>
                <a routerLink="/login">Prijava</a>
                <a routerLink="/registracija">Registracija</a>
            }
        </nav>
    </header>

    <div class="app-content">
        <router-outlet></router-outlet>
    </div>

    <footer class="app-footer">
        SportSphere Hub
    </footer>
</div>
